name: Claude Gutachter

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  gutachten:
    # Nur für Personen mit Repo-Beziehung: der Lauf verbraucht bezahltes API-Kontingent und postet
    # unter der Identität des Projekts (F-029). Fremde Issues/PRs erhalten kein automatisches Gutachten.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event_name == 'issues' && github.event.issue.author_association
               || github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gutachter-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: PR-Diff ermitteln
        if: github.event_name == 'pull_request'
        run: |
          git diff origin/${{ github.base_ref }}...HEAD | head -c 10000 > /tmp/diff.txt

      - name: Gutachten erstellen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          REPO:              ${{ github.repository }}
          EVENT_NAME:        ${{ github.event_name }}
          PR_NUMBER:         ${{ github.event.pull_request.number }}
          PR_TITLE:          ${{ github.event.pull_request.title }}
          PR_BODY:           ${{ github.event.pull_request.body }}
          ISSUE_NUMBER:      ${{ github.event.issue.number }}
          ISSUE_TITLE:       ${{ github.event.issue.title }}
          ISSUE_BODY:        ${{ github.event.issue.body }}
        run: python3 .github/scripts/claude_review.py
